name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Node 22, Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm test

  startup:
    name: Startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the local server and load its bootstrap API
        shell: bash
        run: |
          set -euo pipefail
          npm run build:editor
          node server.mjs > "$RUNNER_TEMP/foundry-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4173/api/bootstrap \
              -o "$RUNNER_TEMP/bootstrap.json"; then
              node -e "
                const fs = require('node:fs');
                const data = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/bootstrap.json', 'utf8'));
                if (!data.token || !data.curriculum || !data.progress) {
                  throw new Error('Bootstrap response is missing expected fields.');
                }
                console.log('Server started and returned the curriculum bootstrap.');
              "
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Server exited during startup." >&2
              cat "$RUNNER_TEMP/foundry-server.log" >&2
              exit 1
            fi
            sleep 1
          done

          echo "Server did not answer within 60 seconds." >&2
          cat "$RUNNER_TEMP/foundry-server.log" >&2
          exit 1
